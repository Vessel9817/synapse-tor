name: CI

on:
  push:
  pull_request:

env:
  DOCKER_VERSION: v29.9.1
  DOCKER_COMPOSE_VERSION: v5.6.1

jobs:
  # Builds the compose project
  build:
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Set up Docker
        uses: docker/setup-docker-action@v5
        with:
          version: ${{ env.DOCKER_VERSION }}
      - name: Set up Docker Compose
        uses: docker/setup-compose-action@v2
        with:
          version: ${{ env.DOCKER_COMPOSE_VERSION }}
      - name: Build Compose stack
        run: docker compose --profile production --profile development --profile monitor build
  # Runs a markdown linting check
  markdownlint:
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04]
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: DavidAnson/markdownlint-cli2-action@v24
      with:
        config: .markdownlint-cli2.jsonc
