name: CI

on:
  push:

env:
  DOCKER_VERSION: v29.7.2
  DOCKER_COMPOSE_VERSION: v5.4.0

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Set up Docker
        uses: docker/setup-docker-action@v5
        with:
          version: ${{ env.DOCKER_VERSION }}
      - name: Set up Docker Compose
        uses: docker/setup-compose-action@v2
        with:
          version: ${{ env.DOCKER_COMPOSE_VERSION }}
      - name: Build Compose stack
        run: docker compose --profile production --profile development build
